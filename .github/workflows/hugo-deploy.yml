name: Deploy
on:
  push:
    branches: [main]
  schedule:
  - cron: 0 12 * * *

  pull_request: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hugo:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Install Hugo
      uses: peaceiris/actions-hugo@16361eb4acea8698b220b76c0d4e84e1fd22c61d
      with:
        hugo-version: "0.160.1"
        extended: true

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: "stable"

    - run: hugo mod get
    - run: hugo --minify

    - uses: actions/upload-artifact@v7
      with:
        name: site
        path: public/
        if-no-files-found: error
        retention-days: 3
    timeout-minutes: 30
  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: hugo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: site
        path: public/
    - uses: actions/upload-artifact@v7
      with:
        name: site
        path: public/
        if-no-files-found: error
        retention-days: 3
    timeout-minutes: 10
